[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "danredvarg-templicate"
version = "0.1.0"
description = "按结构特征把多份提示词聚成模板族，标出每个变体相对族模板改动了哪些槽位"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "danredvarg" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://danredvarg.github.io"
Repository = "https://github.com/danredvarg/templicate"
Issues = "https://github.com/danredvarg/templicate/issues"

[project.scripts]
templicate = "templicate:main"

[tool.setuptools]
py-modules = ["templicate"]
